name: sistema-escolar

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: se-postgres
    environment:
      POSTGRES_USER: escuela
      POSTGRES_PASSWORD: escuela-local   # solo desarrollo local; en staging/prod va por env/Secret
      POSTGRES_DB: escuela
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escuela"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: se-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: se-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: se-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: escuela
      MINIO_ROOT_PASSWORD: escuela-local   # solo desarrollo local
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: se-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    # Tras el primer up, bajar el modelo de moderación:
    #   docker exec se-ollama ollama pull llama3.2:3b

volumes:
  pgdata:
  miniodata:
  ollamadata:
