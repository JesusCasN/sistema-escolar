name: sistema-escolar

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: se-postgres
    environment:
      POSTGRES_USER: escuela
      POSTGRES_PASSWORD: escuela-local   # solo desarrollo local; en staging/prod va por env/Secret
      POSTGRES_DB: escuela
    ports:
      # 5433 en el host a proposito: el 5432 suele estar ocupado por una instalacion
      # nativa de PostgreSQL en la maquina del desarrollador. Ver infra/README.md.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se monta el DIRECTORIO completo, no un archivo suelto: en Docker Desktop
      # para Windows los bind mounts de archivos individuales fallan seguido.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escuela"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Imagen oficial de Apache en modo KRaft (sin ZooKeeper).
  # Nota: antes se usaba bitnami/kafka, pero Bitnami retiro sus imagenes gratuitas
  # de Docker Hub en agosto de 2025. Las variables de la imagen oficial NO llevan
  # el prefijo KAFKA_CFG_ que usaba Bitnami.
  kafka:
    image: apache/kafka:4.1.2
    container_name: se-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Un solo broker en local: los topicos internos no pueden replicarse mas.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: se-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: se-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: escuela
      MINIO_ROOT_PASSWORD: escuela-local   # solo desarrollo local
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    container_name: se-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    # Tras el primer up, bajar el modelo de moderación:
    #   docker exec se-ollama ollama pull llama3.2:3b

volumes:
  pgdata:
  miniodata:
  ollamadata:
